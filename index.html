<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Terrain Gacha Lab — 程序化地形实验</title>
  <link rel="stylesheet" href="styles.css?v=20261021d">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">TG</span>
      <div>
        <h1>Terrain Gacha Lab</h1>
        <p>独立实现的程序化地形实验 · 非官方</p>
      </div>
    </div>
    <div class="actions">
      <button id="exportPng" class="ghost" type="button">导出 PNG</button>
      <button id="exportJson" class="ghost" type="button">导出状态 JSON</button>
    </div>
  </header>

  <main>
    <aside class="panel">
      <section class="group">
        <h2>地形</h2>
        <label class="field">
          <span>类型</span>
          <select id="type">
            <option value="river">河谷</option>
            <option value="slope">海岸坡地</option>
            <option value="onsen">山间温泉谷</option>
            <option value="fjord">峡湾海岸</option>
            <option value="caldera">火山口岛</option>
          </select>
        </label>

        <label class="field">
          <span>Seed</span>
          <div class="row">
            <input id="seed" type="number" min="1" max="999999999" value="20261019">
            <button id="dice" class="icon" type="button" title="随机 seed">🎲</button>
          </div>
        </label>

        <div class="grid2">
          <label class="field">
            <span>范围</span>
            <select id="size">
              <option value="2000">2 km</option>
              <option value="4000">4 km</option>
              <option value="6000" selected>6 km</option>
              <option value="8000">8 km</option>
            </select>
          </label>
          <label class="field">
            <span>分辨率</span>
            <select id="res">
              <option value="256">256</option>
              <option value="512" selected>512</option>
              <option value="1024">1024（慢）</option>
            </select>
          </label>
        </div>

        <label class="check">
          <input id="erosion" type="checkbox" checked>
          <span>水滴侵蚀</span>
        </label>

        <button id="generate" class="primary" type="button">生成地形</button>
      </section>

      <section class="group">
        <h2>视图</h2>
        <div class="tabs" id="views">
          <button data-view="color" class="on" type="button">彩色</button>
          <button data-view="height" type="button">高度</button>
          <button data-view="slope" type="button">坡度</button>
          <button data-view="flow" type="button">汇流</button>
          <button data-view="reflex" type="button" title="三级级联反射层诊断透视">反射诊断</button>
          <button data-view="town" type="button">城镇</button>
          <button data-view="3d" type="button">3D</button>
        </div>
        <label class="check">
          <input id="showTown" type="checkbox" checked>
          <span>显示城镇</span>
        </label>
        <div class="legend">
          <span><i style="background:#e8aa5c"></i>中心</span>
          <span><i style="background:#c4cc74"></i>住宅</span>
          <span><i style="background:#6eaa60"></i>农田</span>
          <span><i style="background:#b082c4"></i>工业</span>
          <span><i style="background:#baa68e"></i>集落</span>
          <span><i class="rail"></i>铁路/车站</span>
          <span><i class="parcel"></i>地块</span>
        </div>
        <div class="legend eco" aria-label="生态图例">
          <span><i class="eco-forest"></i>森林</span>
          <span><i class="eco-grass"></i>草地</span>
          <span><i class="eco-rock"></i>岩石</span>
          <span><i class="eco-snow"></i>雪线</span>
          <span><i class="eco-wetland"></i>湿地</span>
          <span><i class="eco-beach"></i>沙滩</span>
        </div>
        <div class="legend reflex-legend" aria-label="反射诊断图例" id="reflexLegend" hidden>
          <span><i style="background:#2ad272"></i>自洽健康 (&gt;0.2)</span>
          <span><i style="background:#e4b230"></i>边缘疑难 (-0.15~0.2)</span>
          <span><i style="background:#d63030"></i>病理违和 (&lt;-0.15)</span>
        </div>
        <div id="reflexNavWrap" class="reflex-nav-wrap" hidden>
          <div class="reflex-nav-header">
            <span>违和切片巡检 (<b id="anomalyCount">0</b>)</span>
            <button id="btnNextAnomaly" class="btn-micro" type="button">聚焦下一个 ⇥</button>
          </div>
          <div id="anomalyCard" class="anomaly-card">无异常切片</div>
        </div>
        <p class="hint" id="hint">鼠标移到画布上查看高度、坡度、汇流量与分区。</p>
      </section>

      <section class="group">
        <h2>统计</h2>
        <div id="stats" class="stats">尚未生成</div>
      </section>

      <section class="group note">
        <h2>说明</h2>
        <p>这是一个独立重写的教学用 MVP，只借鉴公开的设计思想，不包含原项目代码或素材。</p>
      </section>
    </aside>

    <section class="stage">
      <div class="canvas-wrap">
        <canvas id="canvas" width="512" height="512"></canvas>
        <canvas id="canvas3d" width="512" height="512"></canvas>
        <div id="status" class="status">准备就绪</div>
        <div id="hover" class="hover"></div>
        <!-- Minimap 总图及当前板块定位 -->
        <div id="minimapWrap" class="minimap-wrap" title="世界全景总图 (红框为当前聚集视口)">
          <canvas id="minimapCanvas" width="96" height="96"></canvas>
          <div id="minimapBox" class="minimap-box"></div>
        </div>
        <div id="timelineBar" class="timeline-bar" hidden>
          <button id="timelinePlay" class="timeline-btn" type="button" title="播放/暂停">▶ 演化</button>
          <input id="timelineSlider" class="timeline-slider" type="range" min="0" max="1000" value="1000">
          <span id="timelineLabel" class="timeline-label">100%</span>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="src/main.js?v=56"></script>
</body>
</html>
